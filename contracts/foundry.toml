[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
# Simulate with Monad execution rules (Foundry >= 1.8), as the Monad docs recommend
network = "monad"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

# Settings Monad recommends for Sourcify (MonadVision) verification
bytecode_hash = "none"
use_literal_content = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad = "https://rpc.monad.xyz"
local = "http://127.0.0.1:8545"
